<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px">
    <h2 class="fw-bold text-center">🛒 MiTienda</h2>
    <p class="text-center text-muted mb-4">Crea tu cuenta</p>

    @if (error()) {
      <div class="alert alert-danger py-2">{{ error() }}</div>
    }

    <!-- (ngSubmit): al pulsar el boton se llama a Register() -->
    <form (ngSubmit)="Register()">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" [(ngModel)]="RegisterModel.nombre">
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" name="email" placeholder="correo@ejemplo.com" [(ngModel)]="RegisterModel.email">
      </div>

      <div class="mb-3">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="contrasena" name="password" placeholder="••••••••" [(ngModel)]="RegisterModel.password">
      </div>

      <div class="mb-3">
        <label for="confirmar" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="••••••••" [(ngModel)]="confirmarPassword">
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
        {{ cargando() ? 'Registrando…' : 'Registrarse' }}
      </button>
    </form>

    <!-- Navegacion de vuelta al Login -->
    <p class="text-center mt-3 mb-0">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
