<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px">
    <!-- Nombre de la tienda: vuelve al Home -->
    <a routerLink="/" class="text-decoration-none text-dark text-center">
      <h2 class="fw-bold">🛒 MiTienda</h2>
    </a>
    <p class="text-center text-muted mb-4">Crea tu cuenta</p>

    <form>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com">
      </div>

      <div class="mb-3">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="contrasena" placeholder="••••••••">
      </div>

      <div class="mb-3">
        <label for="confirmar" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmar" placeholder="••••••••">
      </div>

      <!-- type="button": el boton no envia nada todavia (el registro no es funcional en este taller) -->
      <button type="button" class="btn btn-primary w-100">Registrarse</button>
    </form>

    <!-- Navegacion de vuelta al Login -->
    <p class="text-center mt-3 mb-0">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
